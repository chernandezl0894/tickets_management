[project]
name = "tickets-management"
version = "0.0.1"
description = "Gestor de tickets multi-plataforma, multi-proyecto"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.146.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tickets_management"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "ASYNC", # flake8-async
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["tickets_management"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
